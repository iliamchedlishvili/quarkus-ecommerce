# PostgreSQL connection

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus-ecommerce


# --- Hibernate (Flyway owns schema) ---
quarkus.hibernate-orm.database.generation=none
# Optional but helpful to align expectations:
quarkus.hibernate-orm.database.default-schema=emp
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Tell Flyway which schema(s) it manages (first holds flyway_schema_history)
quarkus.flyway.schemas=emp
quarkus.flyway.create-schemas=true